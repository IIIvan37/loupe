[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loupe-server"
version = "0.1.0"
description = "loupe — atelier de pratique musicale (serveur local + navigateur)"
requires-python = ">=3.11"
# The DISTRIBUTED dependency set (D3): storage + download + static serving.
# The ML stacks (torch, demucs, beat_this…) stay in requirements.txt for the
# dev/CI host — their modules are lazy imports whose endpoints the web app
# never calls in distribution (analyses run on Modal).
dependencies = [
    "fastapi==0.139.1",
    "uvicorn[standard]==0.51.0",
    "yt-dlp==2026.7.4",
]

[project.scripts]
loupe = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]
# The built web app, copied here by scripts/build-server-dist.sh right before
# `uv build` — the wheel is self-contained (see app/web_dist.py resolution).
artifacts = ["app/web_dist"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored model code is kept verbatim (checkpoint compatibility) — neither
# linted nor formatted to our style.
extend-exclude = ["app/btc", "app/songformer"]

[tool.ruff.lint]
# A pragmatic set: pyflakes + pycodestyle + import order + bugbear + comprehensions
# + pyupgrade + simplify. The server is an adapter (I/O glue), so we keep it
# strict on correctness/imports without pulling in docstring/annotation churn.
select = ["E", "F", "I", "B", "C4", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers and monkeypatch internals on purpose.
"tests/*" = ["SLF001"]

[tool.pyright]
include = ["app"]
# separation.py / tempo.py / chords.py / structure.py (+ the vendored btc /
# songformer trees) are the torch/librosa humble objects; they import the heavy
# ML stack that CI deliberately doesn't install, so they're type-checked
# manually rather than in the torch-free CI. Everything decidable lives elsewhere.
exclude = [
    "app/separation.py",
    "app/tempo.py",
    "app/chords.py",
    "app/btc",
    "app/structure.py",
    "app/songformer",
    "**/.venv",
]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
# torch / demucs / librosa / yt_dlp ship partial or no stubs; don't fail on them.
reportMissingModuleSource = false

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
# Omit the ML humble objects: their inference/DSP paths are covered manually, and
# they aren't even imported in the torch-free test run — measuring them would make
# coverage depend on whether torch happens to be installed.
omit = [
    "tests/*",
    "app/separation.py",
    "app/tempo.py",
    "app/chords.py",
    "app/btc/*",
    "app/structure.py",
    "app/songformer/*",
]
