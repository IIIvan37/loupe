[package]
name = "loupe-download"
version = "0.1.0"
description = "Shared yt-dlp download engine: managed binary, guards, progress"
edition = "2021"
rust-version = "1.77.2"
license = "UNLICENSED"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "sync", "macros"] }
url = "2"
ureq = "3"
sha2 = "0.10"
hex = "0.4"
