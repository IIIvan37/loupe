name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger for the deep tier (Windows gate, mutation) on any ref —
  # e.g. to verify a portability fix on a branch before merging.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on branches/PRs, but NEVER on main: a push there
  # would kill the in-flight post-merge mutation run (>1 h) — on 2026-07-31
  # three successive doc pushes meant Stryker never concluded. On main, new
  # runs queue instead (GitHub keeps only the latest pending), so the run in
  # flight always finishes and the tip always gets tested eventually.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate

  gate-windows:
    name: Quality gate (windows)
    # Deep tier, like mutation: the `loupe` binary ships a Windows build,
    # but the per-PR loop is not where that check earns its keep — Windows
    # runners are billed at 2× and are slow, and portability regressions are
    # rare. Runs post-merge on main, and on demand (workflow_dispatch) to
    # verify a portability fix on a branch. In the template this leg's very
    # first run caught a real bug: no .gitattributes meant CRLF checkouts,
    # failing Biome on every line.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # check:shell needs the system shellcheck; ubuntu/macos images ship it
      # but windows-latest (2025 image) does not — every post-merge windows
      # gate was red from check:shell's first run (lot AT) until this step.
      - name: Install shellcheck (absent from the windows-latest image)
        run: choco install shellcheck --no-progress -y
      - run: pnpm gate

  server:
    name: Server (lint · types · tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      # Torch-free by design: requirements-dev.txt omits the heavy ML stack, so
      # the run is fast and never downloads Demucs weights. The ML humble objects
      # (separation.py / tempo.py) are excluded from ruff-types/coverage and
      # exercised only via their absent-capability fallback.
      - run: python -m venv .venv
      - run: .venv/bin/pip install --upgrade pip
      - run: .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/ruff check app tests modal_app.py
      - run: .venv/bin/ruff format --check app tests modal_app.py
      - run: .venv/bin/pyright
      - run: .venv/bin/python -m pytest

  edge-functions:
    name: Edge Functions (deno check · lint · fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # No live stack: type-check + lint + format only. The only network access
      # is djwt from deno.land; the integration suite (index.test.ts) stays a
      # local-stack affair (see docs/j2-supabase-runbook.md).
      - run: deno check --config supabase/functions/deno.json supabase/functions/mint-analyze-token/*.ts
      - run: deno lint supabase/functions/mint-analyze-token/
      - run: deno fmt --check supabase/functions/mint-analyze-token/

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >
          pnpm exec commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose

  mutation:
    name: Mutation testing (core)
    # Deep check — post-merge on main and on demand, to keep PRs to the fast
    # gate. (You also run it locally at each close-step, before opening the PR.)
    # 120 min, not 20: a cold full run takes 79 min (measured 2026-08-02,
    # dispatch 30742742446 — score 93.10). The old 20-min timeout killed the
    # job on every main push since 2026-07-09, so the incremental cache below
    # never got saved and every run started cold: the authoritative mutation
    # score had never actually concluded on main before that dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `incremental: true` in stryker.config.json only pays off if the state
      # file survives the run — otherwise every CI run mutates everything.
      - name: Restore Stryker incremental state
        uses: actions/cache@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.sha }}
          restore-keys: stryker-

      - run: pnpm test:mutation

      # A score in a log line is not actionable; the HTML report shows which
      # mutants survived and where.
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 14

  # AT.2: the authoritative tier (Windows gate, mutation) runs post-merge,
  # where nobody is watching a PR page — v0.1.0 was tagged on a main whose
  # last concluded run was a failure and no one had seen the red. A failure
  # on main now opens (or comments) an issue, so the red has an inbox.
  notify-red-main:
    name: Signal a red main
    needs: [gate, gate-windows, server, edge-functions, mutation, audit]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the red-main issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ci-main-rouge --repo "$GITHUB_REPOSITORY" \
            --description "CI en échec sur main" --color B60205 --force
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-main-rouge \
            --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Nouveau run rouge sur main : $RUN_URL (commit ${GITHUB_SHA})"
          else
            body="$(printf '%s\n\n%s' \
              "Un run du tier autoritaire a échoué sur main : $RUN_URL (commit ${GITHUB_SHA})." \
              "La release exige un main vert (release.yml, job verify) : tant que main reste rouge, aucun tag ne passera. Fermer après remise au vert.")"
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "CI rouge sur main" --label ci-main-rouge \
              --body "$body"
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dependabot handles the routine bumps; this fails the build on a known
      # high or critical advisory, which should not wait for a weekly PR.
      - run: pnpm audit --audit-level high
