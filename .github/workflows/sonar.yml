name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    # Dependabot PRs run with the Dependabot secret store, NOT the Actions one,
    # so `secrets.SONAR_TOKEN` is empty there and the scan fails on every single
    # one of them — a red check that says nothing about the bump. Skipping is the
    # right answer rather than mirroring the token into Dependabot secrets: a
    # lockfile bump adds no code to analyse, and a token reachable from a
    # bot-authored branch is exactly the exposure to avoid. Analysis on `main`
    # (after the merge) still covers whatever the bump changed.
    # The job is SKIPPED, not absent: the workflow still triggers, so the
    # required check reports and the PR is not left waiting on it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    timeout-minutes: 20
    steps:
      # Full history: SonarCloud needs it to compute new-code periods and blame.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # coverage/lcov.info for the JS/TS side of the report.
      - run: pnpm test:coverage

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      # Torch-free like ci.yml's server job; adds the XML report Sonar reads.
      - run: python -m venv .venv
        working-directory: server
      - run: .venv/bin/pip install --upgrade pip
        working-directory: server
      - run: .venv/bin/pip install -r requirements-dev.txt
        working-directory: server
      - run: .venv/bin/python -m pytest --cov-report=xml
        working-directory: server

      - uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
