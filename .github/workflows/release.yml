name: Release

# D5: push a `vX.Y.Z` tag on a green main → one binary per OS, a GitHub
# Release with checksums, and a generated Homebrew formula. One version
# everywhere: the tag must equal the crate version, which `--version` prints.
# D6: `workflow_dispatch` builds the same binaries WITHOUT publishing — the
# artifacts are attached to the run, for platform validation in a VM.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tag matches crate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag and loupe-server version
        # Only a tag push carries a version to check; a manual dispatch
        # (D6 test build) has no tag, so this is a no-op there.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/loupe-server/Cargo.toml | head -1)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag ≠ crates/loupe-server version $crate — bump Cargo.toml first (docs/RELEASING.md)"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          # ubuntu-22.04, not -latest: the binary links the build runner's
          # glibc, and building on the older LTS keeps it runnable there.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      # Web dist (server shell, prod config from packages/web/.env.production)
      # embedded into the release binary — same script as a local build.
      - name: Build the loupe binary
        shell: bash
        run: ./scripts/build-loupe-binary.sh
      # A dispatch ref can be a branch (`feat/x`); '/' would make the archive
      # name a path, so flatten it. Windows gets a real .zip via PowerShell —
      # `tar` in git-bash is GNU tar, which cannot write zip (it silently
      # emits an uncompressed tar under the .zip name); unix gets .tar.gz.
      - name: Package archive (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist-release
          ref="${GITHUB_REF_NAME//\//-}"
          tar -czf "dist-release/loupe-${ref}-${{ matrix.target }}.tar.gz" \
            -C target/release loupe
      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $ref = "${env:GITHUB_REF_NAME}" -replace '/', '-'
          $archive = "loupe-$ref-${{ matrix.target }}.zip"
          Compress-Archive -Path target/release/loupe.exe `
            -DestinationPath "dist-release/$archive"
      - uses: actions/upload-artifact@v7
        with:
          name: loupe-${{ matrix.target }}
          path: dist-release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Only a tag push publishes; a manual dispatch stops at the uploaded
    # build artifacts (D6 test build, no public Release).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Generate Homebrew formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha_of() { sha256sum "artifacts/$1" | cut -d' ' -f1; }
          sed -e "s/{{VERSION}}/${version}/g" \
              -e "s/{{SHA_DARWIN_ARM64}}/$(sha_of "loupe-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz")/" \
              -e "s/{{SHA_LINUX_X64}}/$(sha_of "loupe-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz")/" \
              packaging/homebrew/loupe.rb.tmpl > artifacts/loupe.rb
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "loupe $GITHUB_REF_NAME" \
            --generate-notes
      # Only when the tap secret is configured (fine-grained PAT, contents
      # write on IIIvan37/homebrew-loupe) — otherwise the formula simply
      # ships as a release asset. See docs/RELEASING.md.
      - name: Push formula to the Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/IIIvan37/homebrew-loupe.git" tap
          mkdir -p tap/Formula
          cp artifacts/loupe.rb tap/Formula/loupe.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/loupe.rb
          git commit -m "loupe ${GITHUB_REF_NAME}"
          git push
