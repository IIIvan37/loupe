version: 2

# Automated dependency maintenance. pnpm (lockfile v9) is handled natively by the
# "npm" ecosystem. Updates are grouped to limit PR noise (the toolchain is dense).
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # A dependency joins the FIRST group it matches, so the version-locked
    # families are declared before the catch-all `dev-dependencies` — otherwise
    # their dev half (@lingui/cli, @types/react) would land in the generic group
    # and split the family across two PRs, which is the very failure below.
    groups:
      # React and its renderer must move in ONE PR: react-dom refuses to run
      # against a different react version ("Incompatible React versions"), so a
      # solo bump reds the whole suite — 72 failed files on PR #273. The types
      # follow the runtime, same reason.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # Same lock, different symptom: the @lingui/* packages exchange types
      # across their boundary (`I18n`), so a solo bump leaves two copies of that
      # type in the store and typecheck fails on an « I18n is not assignable to
      # I18n » — PR #274.
      lingui:
        patterns:
          - "@lingui/*"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # CVE watch on the Python analysis stack (AA.1). The pins are deliberate
  # (upgrades are an operator action — Lot A.1); advisories notify without
  # auto-installing, which is exactly the missing piece: a strictly-pinned
  # torch/transformers/yt-dlp would otherwise never signal a CVE. yt-dlp in
  # particular parses hostile remote content by construction, and the same
  # stack runs on Modal. Limitation: the madmom git pin is invisible to
  # Dependabot — partial but real coverage.
  - package-ecosystem: pip
    directory: "/server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      python-dependencies:
        update-types:
          - minor
          - patch
